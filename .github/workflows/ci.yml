name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  demo:
    name: Demo starts and verifies at L4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Starts the project; the post-start hook installs TYPO3 and the demo content.
      - uses: ddev/github-action-setup-ddev@v1
      - name: Pages and audit endpoint answer
        run: |
          for path in / /the-oldest-museum /cabinets-of-curiosity /from-cabinet-to-public-museum \
              /the-biography-of-an-object /editorial-team /sitemap.xml /.well-known/content-provenance; do
            curl --fail --silent --show-error --insecure --output /dev/null "https://typo3-provenance-demo.ddev.site$path"
          done
      - uses: actions/checkout@v7
        with:
          repository: dkd-dobberkau/content-provenance-conformance
          path: conformance
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Audit endpoint conforms to Section 3.4
        working-directory: conformance/reference/python
        run: uv run python check_endpoint.py --insecure https://typo3-provenance-demo.ddev.site
      - name: Facts conform to Section 3.3
        working-directory: conformance/reference/python
        run: uv run python check_facts.py --insecure https://typo3-provenance-demo.ddev.site
      - name: Every page is signed and valid
        working-directory: conformance/reference/python
        run: |
          uv run python verify_site.py --insecure https://typo3-provenance-demo.ddev.site | tee verify.log
          grep --quiet ' 0 invalid, 0 unsigned$' verify.log
      - name: Site reaches L4 and claims no more than it reaches
        working-directory: conformance/reference/python
        run: |
          uv run python check_site.py --insecure https://typo3-provenance-demo.ddev.site | tee site.log
          grep --quiet 'reaches L4 Citable (claims L4)$' site.log
      - name: MX meta tags reach MX Level 2 and agree with the records
        working-directory: conformance/reference/python
        run: |
          uv run python check_mx.py --insecure https://typo3-provenance-demo.ddev.site | tee mx.log
          grep --quiet ' 0 at L1, 0 at L0; 0 findings$' mx.log

  trivy:
    name: Trivy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan repository for vulnerabilities, secrets and misconfiguration
        run: >
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.76.2
          fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 /src
